name: ApplyPilot Desktop (Windows Tauri)

on:
  push:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install web dependencies & build Next.js
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Install desktop dependencies & run cargo check
        working-directory: apps/desktop
        run: |
          npm install
          npm test
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
